name: CI/CD

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build e Push do Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            vininobre/backend:latest
            vininobre/backend:${{ github.sha }}

      - name: Build e Push do Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./client
          push: true
          tags: |
            vininobre/frontend:latest
            vininobre/frontend:${{ github.sha }}

  deploy-to-k3s:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy k3s
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          script: |
            echo "Conectado à instância K3s..."

            echo "Atualizando Backend com nova imagem"
            sudo /usr/local/bin/k3s kubectl set image deployment/backend app=vininobre/backend:${{ github.sha }} -n app-demo

            echo "Atualizando Frontend com nova imagem"
            sudo /usr/local/bin/k3s kubectl set image deployment/frontend web=vininobre/frontend:${{ github.sha }} -n app-demo

            echo "Aguardando rollout concluir..."
            sudo /usr/local/bin/k3s kubectl rollout status deployment/backend -n app-demo
            sudo /usr/local/bin/k3s kubectl rollout status deployment/frontend -n app-demo

            echo "✅ Deploy atualizado com sucesso!"
