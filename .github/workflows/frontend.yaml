name: CI/CD Frontend Kubernetes

on:
  push:
    branches:
      - master  # roda sempre que houver push na master

env:
  IMAGE_NAME: vininobre/frontend
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Login no Docker Hub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 3️⃣ Build e push da imagem Docker
      - name: Build and Push Docker Image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG ./client
          docker push $IMAGE_NAME:$IMAGE_TAG

      # 4️⃣ Instalar kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # 5️⃣ Deploy no Kubernetes
      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          echo "Atualizando imagem do frontend..."
          kubectl set image deployment/frontend web=$IMAGE_NAME:$IMAGE_TAG --namespace=app-demo
          kubectl rollout restart deployment/frontend --namespace=app-demo
          kubectl rollout status deployment/frontend --namespace=app-demo --timeout=11m
